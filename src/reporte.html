<main class="doc-main">
  <div class="doc-bar no-print">
    <a class="btn btn-ghost" href="/panel">Volver a mi cuenta</a>
    <button class="btn btn-primary" id="docPdf" type="button" disabled>Descargar PDF</button>
  </div>
  <p class="hint doc-tip no-print" id="docTip">En la ventana que se abre, elige <b>Guardar como PDF</b>.</p>
  <div class="msg" id="docMsg"></div>
  <article class="doc" id="doc" hidden></article>
  <div class="card rep-wait no-print" id="docWait"><div class="rep-spin" aria-hidden="true"></div><div><b>Preparando tu reporte</b><p class="hint">Un momento.</p></div></div>
</main>
