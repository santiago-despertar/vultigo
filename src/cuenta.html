<main class="app-main">
  <div class="wrap">
    <div class="panel">
      <div class="tabs" role="tablist">
        <button class="active" data-tab="signup" role="tab">Crear cuenta</button>
        <button data-tab="login" role="tab">Entrar</button>
      </div>

      <button class="btn btn-google btn-block" type="button" data-google>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l8-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-8 6.2C6.6 42.6 14.6 48 24 48z"/></svg>
        Continuar con Google
      </button>
      <div class="or"><span>o con tu correo</span></div>

      <form id="signupForm" data-pane="signup" novalidate>
        <div class="field"><label for="su-name">Tu nombre</label><input id="su-name" name="nombre" type="text" autocomplete="name" maxlength="60" required></div>
        <div class="field"><label for="su-email">Correo</label><input id="su-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="su-pass">Contraseña</label><input id="su-pass" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="hint">Mínimo 8 caracteres.</span></div>
        <label class="check"><input type="checkbox" name="terms" required> <span>Acepto los <a href="/terminos.html">términos</a> y el <a href="/privacidad.html">aviso de privacidad</a>.</span></label>
        <div class="msg" id="signupMsg"></div>
        <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
      </form>

      <form id="loginForm" data-pane="login" hidden novalidate>
        <div class="field"><label for="li-email">Correo</label><input id="li-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="li-pass">Contraseña</label><input id="li-pass" name="password" type="password" autocomplete="current-password" required></div>
        <div class="msg" id="loginMsg"></div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <p class="hint" style="text-align:center;margin-top:16px"><a href="#" id="forgot">¿Olvidaste tu contraseña?</a></p>
      </form>
      <div class="msg" id="googleMsg"></div>
    </div>
  </div>
</main>
